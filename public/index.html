<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoH 100 T1D Portal</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #2c3e50;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .card h2 {
      color: #2c3e50;
      margin-bottom: 8px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #34495e;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #27ae60;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #1e824c;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #196f3d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏥 MoH 100 T1D Portal</h2>
    <div class="subtitle">Sign in to access your role workspace</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store token in localStorage
          localStorage.setItem('token', data.token);

          // Route to specific role workspace
          if (data.user.roleId === 1) {
            window.location.href = '/chp.html';
          } else if (data.user.roleId === 2) {
            window.location.href = '/hrio.html';
          } else if (data.user.roleId === 3) {
            window.location.href = '/hcp.html';
          } else {
            window.location.href = '/hrio.html';
          }
        } else {
          alert(data.error || 'Login failed');
        }
      } catch (err) {
        console.error('Login request error:', err);
        alert('Network or server error during sign in.');
      }
    });
  </script>

</body>
</html>
