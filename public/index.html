<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1D System - Portal Login</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #2c3e50; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-card { background: white; padding: 35px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h2 { margin-top: 0; color: #2c3e50; text-align: center; }
    p { color: #7f8c8d; font-size: 14px; text-align: center; margin-bottom: 25px; }
    label { display: block; margin-top: 12px; font-weight: 600; color: #34495e; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; margin-top: 25px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #219150; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🏥 MoH 100 T1D Portal</h2>
    <p>Sign in to access your role workspace</p>
    <form id="loginForm">
      <label>Phone Number</label>
      <input type="text" id="loginPhone" required placeholder="0700000000">

      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">

      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phoneNumber = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('t1d_jwt_token', data.token);
          localStorage.setItem('t1d_user_info', JSON.stringify(data.user));

          // Role-Based Redirection Routing
          switch (data.user.roleId) {
            case 1:
              window.location.href = '/chp.html';
              break;
            case 2:
              window.location.href = '/hrio.html';
              break;
            case 3:
              window.location.href = '/hcp.html';
              break;
            default:
              alert('Unassigned user role. Contact System Administrator.');
          }
        } else {
          alert(data.error || 'Login failed');
        }
      } catch (err) {
        console.error('Login request failed:', err);
      }
    });
  </script>
</body>
</html>
