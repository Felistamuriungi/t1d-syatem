<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIO Intake Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f7f6;
      padding: 20px;
    }
    .header {
      background-color: #3498db;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .btn-logout {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout:hover {
      background-color: #c0392b;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .badge-high {
      background-color: #e74c3c;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .btn-ack {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-ack:hover {
      background-color: #27ae60;
    }
    .status-msg {
      padding: 15px;
      color: #555;
      font-style: italic;
    }
    .error-msg {
      color: #d9534f;
      background-color: #f2dede;
      border: 1px solid #ebccd1;
      padding: 12px;
      border-radius: 4px;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div class="header">
    <h2>🏥 HRIO Intake Workspace</h2>
    <div>
      <span id="user-display" style="margin-right: 15px; font-weight: 500;">Dr. Sarah HRIO</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card">
    <h2>Pending Facility Referrals</h2>
    <div id="status-container" class="status-msg">Loading tickets...</div>
    
    <table id="tickets-table" style="display: none;">
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Patient Name</th>
          <th>Age / Gender</th>
          <th>Contact</th>
          <th>RBS Value</th>
          <th>Risk Level</th>
          <th>Date Issued</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tickets-tbody">
        <!-- Dynamic rows render here -->
      </tbody>
    </table>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;

    document.addEventListener('DOMContentLoaded', () => {
      // Unregister any active offline Service Workers interfering with responses
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // Auto-set development token if missing so testing never breaks
      if (!localStorage.getItem('token')) {
        localStorage.setItem('token', 'DEV_TOKEN');
      }

      fetchPendingReferrals();
    });

    async function fetchPendingReferrals() {
      const token = localStorage.getItem('token') || 'DEV_TOKEN';
      const statusContainer = document.getElementById('status-container');
      const table = document.getElementById('tickets-table');

      try {
        // Fallback-aware fetch trying both route names
        let response = await fetch('/api/hrio/pending', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 404) {
          response = await fetch('/api/referrals/pending', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
        }

        if (response.status === 401 || response.status === 403) {
          statusContainer.className = 'error-msg';
          statusContainer.innerHTML = '🔒 Token rejected by server. Ensure the <code>DEV_TOKEN</code> rule is present in <code>authenticateToken</code> in <code>index.js</code>.';
          if (table) table.style.display = 'none';
          return;
        }

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
          renderTable(data);
        } else {
          statusContainer.className = 'status-msg';
          statusContainer.textContent = 'No pending referrals found.';
          if (table) table.style.display = 'none';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        statusContainer.className = 'error-msg';
        statusContainer.textContent = `Error loading tickets: ${err.message}`;
        if (table) table.style.display = 'none';
      }
    }

    function renderTable(tickets) {
      const statusContainer = document.getElementById('status-container');
      const table = document.getElementById('tickets-table');
      const tbody = document.getElementById('tickets-tbody');

      statusContainer.style.display = 'none';
      table.style.display = 'table';
      tbody.innerHTML = '';

      tickets.forEach(ticket => {
        const row = document.createElement('tr');
        const formattedDate = ticket.issued_at ? new Date(ticket.issued_at).toLocaleString() : 'N/A';

        row.innerHTML = `
          <td><strong>#${ticket.ticket_id}</strong></td>
          <td>${escapeHtml(ticket.full_name || 'N/A')}</td>
          <td>${ticket.age || 'N/A'} / ${escapeHtml(ticket.gender || 'N/A')}</td>
          <td>${escapeHtml(ticket.contact || 'N/A')}</td>
          <td>${ticket.rbs_value ? ticket.rbs_value + ' mmol/L' : 'N/A'}</td>
          <td><span class="badge-high">${escapeHtml(ticket.risk_level || 'HIGH')}</span></td>
          <td>${formattedDate}</td>
          <td>
            <button class="btn-ack" onclick="acknowledgeTicket(${ticket.ticket_id})">
              Acknowledge & Refer
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function acknowledgeTicket(ticketId) {
      const token = localStorage.getItem('token') || 'DEV_TOKEN';
      try {
        const res = await fetch(`/api/hrio/acknowledge/${ticketId}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (res.ok) {
          alert(`Ticket #${ticketId} acknowledged and referred to HCP.`);
          fetchPendingReferrals();
        } else {
          const errData = await res.json();
          alert(`Failed to acknowledge: ${errData.error || 'Server error'}`);
        }
      } catch (err) {
        alert(`Network error: ${err.message}`);
      }
    }

    if (socket) {
      socket.on('new_high_risk_patient', (data) => {
        console.log('⚡ Real-time referral received via Socket.io:', data);
        fetchPendingReferrals();
      });
    }

    function logout() {
  localStorage.removeItem('token');
  window.location.href = '/index.html';
}

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
